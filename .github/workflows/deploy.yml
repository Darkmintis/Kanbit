name: Deploy Kanbit to darkmintis-dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kanbit repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Kanbit
        run: npm run build

      - name: Bundle Netlify Functions
        run: |
          npx --yes esbuild netlify/functions/apps.mjs \
            --bundle --platform=node --format=cjs --target=node20 --alias:@=./src \
            --outfile=/tmp/kanbit-apps.cjs
          npx --yes esbuild netlify/functions/search.mjs \
            --bundle --platform=node --format=cjs --target=node20 --alias:@=./src \
            --outfile=/tmp/kanbit-search.cjs
          echo "✅ Functions bundled"

      - name: Checkout darkmintis-dev
        uses: actions/checkout@v4
        with:
          repository: Darkmintis/darkmintis-dev
          token: ${{ secrets.DEPLOY_PAT }}
          path: main-repo

      - name: Copy production files to main repo
        run: |
          # Remove old deployment
          rm -rf main-repo/dist/kanbit
          mkdir -p main-repo/dist/kanbit

          # Copy Next.js static export output (out/ → dist/kanbit/)
          # Strip pre-rendered API stubs — Netlify Functions handle /kanbit/api/*,
          # and static files would otherwise shadow the function rewrite.
          rm -rf out/api
          cp -r out/* main-repo/dist/kanbit/

          # Copy Netlify Functions (self-contained bundles, no hub deps needed)
          mkdir -p main-repo/netlify/functions
          cp /tmp/kanbit-apps.cjs main-repo/netlify/functions/apps.cjs
          cp /tmp/kanbit-search.cjs main-repo/netlify/functions/search.cjs

          # Copy additional assets
          [ -f LICENSE ] && cp LICENSE main-repo/dist/kanbit/ || true
          [ -f README.md ] && cp README.md main-repo/dist/kanbit/ || true

          echo "✅ Production files copied successfully"
          echo "📦 Deployed files:"
          ls -la main-repo/dist/kanbit/
          echo "⚙️ Netlify functions:"
          ls -la main-repo/netlify/functions/

      - name: Commit and push to darkmintis-dev
        run: |
          cd main-repo
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          # Add changes
          git add dist/kanbit netlify/functions

          # Commit only if there are changes
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to deploy"
          else
            git commit -m "🔄 Update Kanbit from commit ${GITHUB_SHA:0:7}"
            git push
            echo "✅ Changes pushed successfully"
          fi

      - name: Deployment summary
        run: |
          echo "## 🎉 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Tool**: Kanbit" >> $GITHUB_STEP_SUMMARY
          echo "- **Live URL**: https://darkmintis.dev/kanbit" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${GITHUB_SHA:0:7}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Deployed Files" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Next.js static export output (out/)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Netlify Functions (apps, search)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ LICENSE" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ README.md" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ℹ️ API" >> $GITHUB_STEP_SUMMARY
          echo "Serverless API served from Netlify Functions:" >> $GITHUB_STEP_SUMMARY
          echo "  - \`/kanbit/api/apps\` → \`/.netlify/functions/apps\`" >> $GITHUB_STEP_SUMMARY
          echo "  - \`/kanbit/api/search\` → \`/.netlify/functions/search\`" >> $GITHUB_STEP_SUMMARY
